name: CI

# Two jobs:
#   lint (Linux) — syntax, shellcheck, zsh, nix parse, secrets, bats.
#   eval (macOS) — `nix flake check`, which instantiates the darwin modules and
#                  therefore cannot run on Linux. Without it the flake's own
#                  evaluation checks — including the cold-is-nondestructive
#                  guard from ADR-007 — never ran in CI at all.
#
# File lists are derived from `git ls-files` rather than hand-maintained here.
# Two hand-written lists (this file and scripts/bin/validate) had drifted apart,
# leaving three scripts checked by neither.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just HEAD
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ── Shell script syntax (bash -n) ─────────────────────────────────────
      - name: Bash syntax check
        run: |
          echo "=== bash -n on every tracked bash script ==="
          failed=0
          while IFS= read -r f; do
            head -1 "$f" | grep -q bash || continue
            if bash -n "$f" 2>&1; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              failed=1
            fi
          done < <(git ls-files 'scripts/bin/*' 'lib/*.sh' 'install.sh')
          exit $failed

      # ── Secret scanning (gitleaks) ────────────────────────────────────────
      # Reuses the repo's own scan-secrets script for parity with local runs.
      - name: Secret scan (gitleaks)
        run: |
          echo "=== gitleaks secret scan (full git history) ==="
          DOTFILES_ROOT="$GITHUB_WORKSPACE" \
            nix shell nixpkgs#gitleaks --command ./scripts/bin/scan-secrets

      # ── Shell script lint (shellcheck) ────────────────────────────────────
      - name: ShellCheck
        run: |
          echo "=== shellcheck on every tracked bash script ==="
          # SC1090/1091: can't follow dynamic source paths (lib/log.sh etc.)
          mapfile -t scripts < <(
            while IFS= read -r f; do
              head -1 "$f" | grep -q bash && echo "$f"
            done < <(git ls-files 'scripts/bin/*' 'lib/*.sh' 'install.sh')
          )
          printf '  will check: %s\n' "${scripts[@]}"
          nix shell nixpkgs#shellcheck --command \
            shellcheck --severity=error --exclude=SC1090,SC1091 "${scripts[@]}"

      # ── Zsh module syntax (zsh -n) ────────────────────────────────────────
      - name: Zsh syntax check
        run: |
          echo "=== zsh -n on all config/zsh/modules/*.zsh ==="
          nix shell nixpkgs#zsh --command bash -c '
            for f in config/zsh/modules/*.zsh config/zsh/custom.zsh config/zsh/.zshenv; do
              if [[ -f "$f" ]]; then
                if zsh -n "$f" 2>&1; then
                  echo "  OK: $f"
                else
                  echo "  FAIL: $f"
                  exit 1
                fi
              fi
            done
          '

      # ── Nix file parse syntax ─────────────────────────────────────────────
      - name: Nix parse check
        run: |
          echo "=== nix-instantiate --parse on every tracked .nix file ==="
          failed=0
          while IFS= read -r f; do
            if nix-instantiate --parse "$f" > /dev/null 2>&1; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              nix-instantiate --parse "$f" 2>&1 | sed 's/^/    /'
              failed=1
            fi
          done < <(git ls-files '*.nix')
          exit $failed

      # ── Unit tests (bats) ─────────────────────────────────────────────────
      - name: Bats unit tests
        run: |
          echo "=== bats test suite ==="
          if [[ -d "tests" ]]; then
            nix shell nixpkgs#bats --command bats tests/
          else
            echo "No tests/ directory found — skipping"
          fi

  eval:
    name: Flake evaluation (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Instantiates hosts/default.nix and nix/home/home.nix against a dummy
      # host. `darwinConfigurations` is empty here on purpose, so without these
      # checks a broken module or a typo'd nixpkgs attribute passes CI cleanly.
      #
      # Note this runs PURE: no .local/ layer exists on the runner, so it also
      # exercises the cold-fork path — exactly what cold-is-nondestructive
      # asserts (ADR-007).
      - name: Nix flake check
        run: nix flake check --print-build-logs
